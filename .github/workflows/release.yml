name: Release

# Build do APK de release fora da máquina do dono (ADR 0026).
# - Push de tag `v*`: compila, confere assinatura/permissões e anexa ao Release.
# - `workflow_dispatch`: compila e sobe o APK como artefato (teste e medição).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do Release que recebe o APK (vazio = só artefato)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  # Impede o husky de tentar instalar ganchos no runner.
  HUSKY: "0"

jobs:
  apk:
    name: APK assinado
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # O runner do GitHub tem ~14 GB livres; RN + NDK estouram isso. Remover o
      # SDK pré-instalado e os toolchains que não usamos libera ~15 GB, e o SDK
      # é reinstalado logo abaixo com as versões exatas do projeto.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/local/lib/android
          # O setup-android recria o SDK aqui; sem a pasta com o dono certo ele
          # falha com EACCES.
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$USER":"$USER" /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # O padrão da action instala o pacote `tools`, que saiu do repositório
          # do SDK e faz o passo falhar.
          cmdline-tools-version: "13114758"
          packages: "platform-tools"

      - name: Instalar SDK, NDK e CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Cache do Gradle
        id: gradle-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # O plugin `with-release-signing` lê ~/.lebot/release.properties em tempo
      # de Gradle. Sem esse arquivo o release sairia com a chave de debug — e o
      # passo "Conferir assinatura" reprova o build.
      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::secrets KEYSTORE_BASE64/STORE_PASSWORD/KEY_PASSWORD ausentes"
            exit 1
          fi
          mkdir -p "$HOME/.lebot"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.lebot/lebot-release.keystore"
          chmod 600 "$HOME/.lebot/lebot-release.keystore"
          {
            echo "storeFile=$HOME/.lebot/lebot-release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=lebot"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$HOME/.lebot/release.properties"
          chmod 600 "$HOME/.lebot/release.properties"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Conferir assinatura injetada
        run: |
          test -f "$HOME/.lebot/release.properties" \
            || { echo "::error::release.properties não foi criado"; exit 1; }
          if ! grep -q "signingConfig signingConfigs.release" android/app/build.gradle; then
            echo "::error::release não usa signingConfigs.release; o plugin de assinatura não rodou"
            exit 1
          fi

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            --no-daemon --max-workers=2 --no-parallel

      # Salva o cache logo após compilar: uma reprovação na verificação não deve
      # custar 20 min de build na próxima tentativa.
      - name: Salvar cache do Gradle
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Conferir assinatura do APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          # Impressão digital pública do certificado de release (docs/release.md).
          ESPERADO="43592A0DF3BD6921BD58DBC5EEC3BB7CBCC86E9371F1AA9337D697B9E75002BD"
          OBTIDO=$(grep -m1 'SHA-256 digest' /tmp/certs.txt | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          if [ "$OBTIDO" != "$ESPERADO" ]; then
            echo "::error::assinatura divergente: esperado $ESPERADO, obtido $OBTIDO"
            exit 1
          fi

      - name: Conferir manifesto
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT2="$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          mkdir -p verificacao
          "$AAPT2" dump permissions "$APK" | tee verificacao/permissoes.txt
          if grep -qE 'RECORD_AUDIO|SYSTEM_ALERT_WINDOW' verificacao/permissoes.txt; then
            echo "::error::APK ainda declara RECORD_AUDIO ou SYSTEM_ALERT_WINDOW"
            exit 1
          fi

          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > verificacao/manifest-tree.txt
          APKANALYZER=$(command -v apkanalyzer || true)
          if [ -z "$APKANALYZER" ]; then
            APKANALYZER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/apkanalyzer | head -n1)
          fi
          "$APKANALYZER" manifest print "$APK" > verificacao/manifest.xml
          # Imprime as linhas para o log: é o que explica a reprovação.
          grep -i 'allowBackup' verificacao/manifest-tree.txt || true
          grep -i 'allowBackup' verificacao/manifest.xml || true
          if ! grep -qiE 'allowBackup="false"' verificacao/manifest.xml; then
            echo "::error::allowBackup não está desligado"
            exit 1
          fi

      - name: Anexar dumps de verificação
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-verificacao
          path: verificacao/
          if-no-files-found: ignore
          retention-days: 7

      - name: Nomear APK
        id: versao
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "lebot-$VERSAO.apk"
          echo "arquivo=lebot-$VERSAO.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lebot-apk
          path: lebot-*.apk
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: Publicar no Release
    needs: apk
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lebot-apk

      - name: Anexar APK ao Release
        run: |
          # Tag nova ainda não tem Release: cria (notas automáticas) antes de anexar.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "LêBot $TAG" --generate-notes
          fi
          gh release upload "$TAG" lebot-*.apk --clobber --repo "$GITHUB_REPOSITORY"
